<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPDATE CHANNEL - THAI 2D LIVE</title>
    <style>
        :root {
            --navy: #001f3f;
            --deep-blue: #003366;
            --white: #ffffff;
            --gray: #f4f4f4;
            --telegram: #0088cc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--gray); display: flex; flex-direction: column; min-height: 100vh; }
        
        header {
            background-color: var(--navy);
            color: var(--white);
            padding: 15px;
            text-align: center;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .logo-circle {
            width: 120px;
            height: 120px;
            background: var(--white);
            border-radius: 50%;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 5px solid var(--navy);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .channel-name {
            font-size: 22px;
            font-weight: bold;
            color: var(--navy);
            margin-bottom: 10px;
        }

        .channel-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.5;
            max-width: 250px;
        }

        .cta-button {
            background-color: var(--telegram);
            color: white;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,136,204,0.3);
            transition: transform 0.2s;
        }
        .cta-button:active { transform: scale(0.95); }

        nav.footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: var(--white);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            border-top: 1px solid #ddd;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #666;
            font-size: 11px;
            font-weight: bold;
        }
        .nav-item.active { color: var(--navy); background: #f0f7ff; }
        .nav-item svg { width: 24px; height: 24px; margin-bottom: 4px; }
    </style>
</head>
<body>

<header>
    <div style="font-size: 20px; font-weight: bold; letter-spacing: 1px;">THAI 2D LIVE</div>
</header>

<div class="content">
    <div class="logo-circle">
        <svg viewBox="0 0 24 24" width="60" height="60" fill="var(--navy)"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    
    <div class="channel-name">THAI 2D LIVE</div>
    <div class="channel-desc">Get the latest 2D results and daily gift numbers directly on Telegram.</div>

    <a href="https://t.me/your_channel_id" class="cta-button">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.14-.29.24-.43.24l.192-2.73 4.97-4.49c.216-.192-.047-.3-.33-.11l-6.14 3.86-2.65-.83c-.574-.18-.585-.574.12-.853l10.36-4c.48-.18.9.11.75.92z"/></svg>
        JOIN CHANNEL
    </a>
</div>

<nav class="footer">
    <a href="gift.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="14" rx="2"/><path d="M12 5V22M7 12H17M12 5H7M12 5H17"/></svg>
        GIFT 2D
    </a>
    <a href="home.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        HOME
    </a>
    <a href="update.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        UPDATE CHANNEL
    </a>
</nav>

</body>
</html>
