<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thai Stock 2D | Premium Live Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div class="app-wrapper">
        <header class="header">
            <div class="header-top">
                <h1 class="logo">THAI STOCK <span>2D</span></h1>
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle Theme">
                    <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
            </div>
            
            <div id="mst-container" class="mst-display">
                <div id="mst-time" class="mst-time">--:--:--</div>
                <div id="mst-date" class="mst-date">--------</div>
            </div>
            <div class="status-badge" id="status">CONNECTING</div>
        </header>

        <main class="container">
            <!-- Hero Live Result -->
            <section class="hero-section">
                <div class="live-card">
                    <div class="live-label">LIVE RESULT</div>
                    <div class="live-2d" id="live-2d-container">
                        <span class="digit" id="digit1">--</span>
                    </div>
                    <div class="market-data">
                        <div class="data-item">
                            <span class="label">SET</span>
                            <span class="value" id="set">--</span>
                        </div>
                        <div class="data-item">
                            <span class="label">VALUE</span>
                            <span class="value" id="value">--</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Sessions Grid -->
            <section class="sessions-grid">
                <div class="session-card">
                    <span class="time">11:00 AM</span>
                    <span id="session1" class="number">--</span>
                </div>
                <div class="session-card">
                    <span class="time">12:01 PM</span>
                    <span id="session2" class="number">--</span>
                </div>
                <div class="session-card">
                    <span class="time">03:00 PM</span>
                    <span id="session3" class="number">--</span>
                </div>
                <div class="session-card">
                    <span class="time">04:30 PM</span>
                    <span id="session4" class="number">--</span>
                </div>
            </section>

            <!-- Insights Table -->
            <section class="glass-panel">
                <h3 class="panel-title">Market Insights</h3>
                <div class="insight-table">
                    <div class="table-row head">
                        <div>Session</div>
                        <div>Modern</div>
                        <div>Internet</div>
                    </div>
                    <div class="table-row">
                        <div class="time-col">09:30 AM</div>
                        <div id="mod930" class="val-col">--</div>
                        <div id="int930" class="val-col">--</div>
                    </div>
                    <div class="table-row">
                        <div class="time-col">02:00 PM</div>
                        <div id="mod1400" class="val-col">--</div>
                        <div id="int1400" class="val-col">--</div>
                    </div>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                <span>Live</span>
            </a>
            <a href="gift.html" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                <span>Analysis</span>
            </a>
            <a href="https://t.me/thaistock_2d?direct" target="_blank" class="nav-item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span>Telegram</span>
            </a>
        </nav>
    </div>

    <!-- Ad Overlay -->
    <div id="sticky-anchor-ad">
        <button class="close-btn" onclick="document.getElementById('sticky-anchor-ad').style.display='none';">×</button>
        <div class="ad-wrapper">
            <a href="https://t.me/thaistock_2d?direct" target="_blank" rel="noopener noreferrer">
                <img src="https://i.postimg.cc/pdcbbw78/In-Shot-20260131-215455741.gif" alt="Advertisement">
            </a>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="state.js"></script>
    <script src="ui.js"></script>
    <script>
        ui.init();
        
        // Theme Toggle Logic
        const themeBtn = document.getElementById('theme-toggle');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            document.body.classList.toggle('dark-theme');
        });
    </script>
</body>
</html>
