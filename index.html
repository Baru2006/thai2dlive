<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SET 2D Live</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
:root{
--bg:#0a0c10;--card:#161b22;--border:#30363d;
--text:#f0f6fc;--muted:#8b949e;--blue:#58a6ff;
}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter}
header{position:sticky;top:0;background:#0d1117;border-bottom:1px solid var(--border);
padding:12px 16px;display:flex;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px}
.main{font-family:JetBrains Mono;font-size:70px;text-align:center}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.label{font-size:11px;color:var(--muted)}
.value{font-family:JetBrains Mono}
.sessions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px}
.session-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px}
.session-result{font-family:JetBrains Mono;font-size:22px;color:var(--blue)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--border)}
th,td{padding:10px;font-size:13px}
th{background:#21262d;color:var(--muted);font-size:10px}
td{border-top:1px solid var(--border)}
</style>
</head>

<body>

<header>
<div>
<strong>SET 2D LIVE</strong><br>
<span id="clock" style="font-size:11px;color:var(--muted);font-family:JetBrains Mono"></span>
</div>
</header>

<div style="padding:20px 16px">
<div class="card">
<div class="label" style="text-align:center">Live Result</div>
<div id="live2d" class="main">--</div>
<div class="grid">
<div><span class="label">SET</span><span id="liveset" class="value">--</span></div>
<div><span class="label">Value</span><span id="liveval" class="value">--</span></div>
</div>
</div>
</div>

<div class="sessions">
<div class="session-card" data-session="11:00"><div>11:00 AM</div><div class="session-result">--</div></div>
<div class="session-card" data-session="12:01"><div>12:01 PM</div><div class="session-result">--</div></div>
<div class="session-card" data-session="15:00"><div>03:00 PM</div><div class="session-result">--</div></div>
<div class="session-card" data-session="16:30"><div>04:30 PM</div><div class="session-result">--</div></div>
</div>

<div style="padding:20px 16px">
<h4>Recent History</h4>
<table>
<thead><tr><th>Time</th><th>SET</th><th>Value</th><th>2D</th></tr></thead>
<tbody id="history"></tbody>
</table>
</div>

<script>
const API='https://api.thaistock2d.com/live';

const normalize=(t)=>{
 if(!t) return '';
 const d=new Date('1970-01-01 '+t);
 return d.getHours().toString().padStart(2,'0')+':' +
        d.getMinutes().toString().padStart(2,'0');
};

function clock(){
 document.getElementById('clock').textContent=
 new Date().toLocaleTimeString('en-GB',{hour12:false});
}
setInterval(clock,1000);clock();

async function load(){
 const res=await fetch(API);
 const data=await res.json();

 if(data.live){
  live2d.textContent=data.live.twod;
  liveset.textContent=data.live.set;
  liveval.textContent=data.live.value;
 }

 if(Array.isArray(data.result)){
  // SESSION SYNC (FIXED)
  ['11:00','12:01','15:00','16:30'].forEach(t=>{
   const m=data.result.find(r=>normalize(r.draw_time)===t);
   const el=document.querySelector(`.session-card[data-session="${t}"] .session-result`);
   if(m && el) el.textContent=m.twod;
  });

  // HISTORY
  history.innerHTML=data.result.slice(0,10).map(r=>`
   <tr>
    <td>${r.draw_time}</td>
    <td>${r.set||'-'}</td>
    <td>${r.value||'-'}</td>
    <td style="font-weight:700;color:var(--blue)">${r.twod}</td>
   </tr>`).join('');
 }
}

load();
setInterval(load,5000);
</script>

</body>
</html>
