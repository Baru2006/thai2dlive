<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai 2D Live Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#001f3f',
                        secondary: '#003366',
                        accent: '#0074D9',
                        bgLight: '#f4f7f9',
                    },
                    animation: {
                        'pulse-slow': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes custom-pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.9; }
        }
        .active-session {
            animation: custom-pulse 2s infinite;
            border: 2px solid #0074D9;
            box-shadow: 0 0 15px rgba(0, 116, 217, 0.3);
        }
        .nav-active {
            color: #0074D9;
        }
        body {
            background-color: #f4f7f9;
            padding-bottom: 80px;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="text-slate-800">

    <!-- Header -->
    <header class="bg-navy text-white p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-tight">THAI 2D LIVE</h1>
                <p id="status-indicator" class="text-xs text-green-400 flex items-center gap-1">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                    </span>
                    Live Updates
                </p>
            </div>
            <div class="text-right">
                <p class="text-[10px] uppercase opacity-70">Last Update</p>
                <p id="last-update" class="text-sm font-mono">--:--:--</p>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main id="app-content" class="max-w-md mx-auto p-4 min-h-screen">
        <!-- Views will be injected here -->
    </main>

    <!-- Templates -->
    <template id="view-home">
        <div class="space-y-6">
            <!-- Live Result Main Display -->
            <div class="bg-gradient-to-br from-navy to-secondary rounded-2xl p-6 text-white text-center shadow-xl">
                <h2 class="text-lg opacity-80 mb-2">Current Result</h2>
                <div id="live-twod" class="text-6xl font-black mb-4 tracking-tighter">--</div>
                <div class="grid grid-cols-2 gap-4 border-t border-white/10 pt-4">
                    <div>
                        <p class="text-xs opacity-60 uppercase">Set</p>
                        <p id="live-set" class="font-bold text-lg">--</p>
                    </div>
                    <div>
                        <p class="text-xs opacity-60 uppercase">Value</p>
                        <p id="live-value" class="font-bold text-lg">--</p>
                    </div>
                </div>
            </div>

            <!-- Session Cards -->
            <div class="grid grid-cols-1 gap-4" id="session-cards">
                <!-- Cards injected by JS -->
            </div>
        </div>
    </template>

    <template id="view-gift">
        <div class="space-y-4">
            <h2 class="text-xl font-bold text-navy flex items-center gap-2">
                <i class="fas fa-gift text-accent"></i> Lucky Numbers
            </h2>
            <div class="grid grid-cols-2 gap-4" id="gift-grid">
                <!-- Gift items injected by JS -->
            </div>
        </div>
    </template>

    <template id="view-history">
        <div class="space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold text-navy">History Logs</h2>
                <button onclick="app.fetchHistory()" class="bg-navy text-white px-3 py-1 rounded-lg text-sm active:scale-95 transition-transform">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
            <div class="space-y-3" id="history-list">
                <!-- History items injected by JS -->
            </div>
        </div>
    </template>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-3 z-50 shadow-[0_-5px_15px_rgba(0,0,0,0.05)]">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <button onclick="app.navigate('home')" class="nav-btn flex flex-col items-center gap-1 transition-colors" data-view="home">
                <i class="fas fa-chart-line text-xl"></i>
                <span class="text-[10px] font-bold uppercase">Home</span>
            </button>
            <button onclick="app.navigate('gift')" class="nav-btn flex flex-col items-center gap-1 transition-colors text-slate-400" data-view="gift">
                <i class="fas fa-gift text-xl"></i>
                <span class="text-[10px] font-bold uppercase">Gift 2D</span>
            </button>
            <button onclick="app.navigate('history')" class="nav-btn flex flex-col items-center gap-1 transition-colors text-slate-400" data-view="history">
                <i class="fas fa-history text-xl"></i>
                <span class="text-[10px] font-bold uppercase">History</span>
            </button>
        </div>
    </nav>

    <script>
        const API_BASE = 'https://api.thaistock2d.com';
        
        const app = {
            currentView: 'home',
            liveData: null,
            refreshInterval: null,
            sessions: [
                { id: '11:00AM', label: 'Morning Open', time: '11:00' },
                { id: '12:01PM', label: 'Morning Close', time: '12:01' },
                { id: '3:00PM', label: 'Afternoon Open', time: '15:00' },
                { id: '4:30PM', label: 'Afternoon Close', time: '16:30' }
            ],

            init() {
                this.navigate('home');
                this.startLiveUpdates();
            },

            async navigate(view) {
                this.currentView = view;
                const container = document.getElementById('app-content');
                const template = document.getElementById(`view-${view}`).content.cloneNode(true);
                container.innerHTML = '';
                container.appendChild(template);

                // Update Nav UI
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    if (btn.dataset.view === view) {
                        btn.classList.add('text-accent');
                        btn.classList.remove('text-slate-400');
                    } else {
                        btn.classList.remove('text-accent');
                        btn.classList.add('text-slate-400');
                    }
                });

                // Load view-specific data
                if (view === 'home') this.renderHome();
                if (view === 'gift') this.fetchGift();
                if (view === 'history') this.fetchHistory();
            },

            startLiveUpdates() {
                this.fetchLive();
                this.refreshInterval = setInterval(() => this.fetchLive(), 10000);
            },

            async fetchLive() {
                try {
                    const response = await fetch(`${API_BASE}/live`);
                    if (!response.ok) throw new Error('Network error');
                    const data = await response.json();
                    this.liveData = data;
                    this.updateLiveUI(data);
                    document.getElementById('status-indicator').classList.replace('text-red-500', 'text-green-400');
                } catch (err) {
                    console.error("Live fetch failed", err);
                    document.getElementById('status-indicator').innerHTML = '<i class="fas fa-times-circle"></i> Offline';
                    document.getElementById('status-indicator').classList.replace('text-green-400', 'text-red-500');
                }
            },

            updateLiveUI(data) {
                if (this.currentView === 'home') {
                    document.getElementById('live-twod').innerText = data.live.twod || '--';
                    document.getElementById('live-set').innerText = data.live.set || '--';
                    document.getElementById('live-value').innerText = data.live.value || '--';
                    this.renderHome(); // Refresh cards
                }
                document.getElementById('last-update').innerText = new Date().toLocaleTimeString();
            },

            renderHome() {
                const cardContainer = document.getElementById('session-cards');
                if (!cardContainer || !this.liveData) return;

                const now = new Date();
                const currentHour = now.getHours();
                const currentMin = now.getMinutes();
                const currentTimeStr = `${currentHour.toString().padStart(2, '0')}:${currentMin.toString().padStart(2, '0')}`;

                cardContainer.innerHTML = '';

                this.sessions.forEach(session => {
                    const sessionData = this.liveData.result.find(r => r.time === session.id) || {};
                    const isFuture = session.time > currentTimeStr;
                    const isActive = this.getIsActive(session.time, currentTimeStr);
                    
                    const card = document.createElement('div');
                    card.className = `bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center transition-all ${isFuture ? 'opacity-40' : 'opacity-100'} ${isActive ? 'active-session' : ''}`;
                    
                    card.innerHTML = `
                        <div>
                            <p class="text-xs font-bold text-navy opacity-60 uppercase">${session.label}</p>
                            <p class="text-sm font-bold text-accent">${session.id}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-2xl font-black text-navy">${sessionData.twod || '--'}</p>
                            <div class="flex gap-2 text-[10px] text-slate-500 font-mono">
                                <span>SET: ${sessionData.set || '--'}</span>
                                <span>VAL: ${sessionData.value || '--'}</span>
                            </div>
                        </div>
                    `;
                    cardContainer.appendChild(card);
                });
            },

            getIsActive(sessionTime, nowTime) {
                // Logic to highlight the nearest previous session
                // For simplicity, we pulse the one closest to now if it's within a 30 min window or the most recent
                return false; // Simplified for this implementation
            },

            async fetchGift() {
                const grid = document.getElementById('gift-grid');
                grid.innerHTML = '<div class="col-span-2 text-center py-10 opacity-50">Loading Gifts...</div>';
                
                try {
                    const res = await fetch(`${API_BASE}/2d_result`);
                    const data = await res.json();
                    grid.innerHTML = '';
                    
                    // The API returns history-like data, we'll extract 10 "lucky" numbers or unique recent ones
                    const numbers = data[0].child.slice(0, 10);
                    const tags = ['Hot', 'VIP', 'Top', 'New', 'Gold'];

                    numbers.forEach((item, index) => {
                        const tag = tags[Math.floor(Math.random() * tags.length)];
                        const card = document.createElement('div');
                        card.className = "bg-white p-6 rounded-2xl shadow-sm border-2 border-transparent hover:border-accent hover:shadow-md transition-all group relative overflow-hidden text-center cursor-pointer";
                        card.innerHTML = `
                            <span class="absolute top-0 right-0 bg-accent text-white text-[9px] font-bold px-2 py-1 rounded-bl-lg uppercase">${tag}</span>
                            <div class="text-3xl font-black text-navy group-hover:text-accent transition-colors">${item.twod}</div>
                            <div class="text-[10px] text-slate-400 mt-1">Winning Luck</div>
                        `;
                        grid.appendChild(card);
                    });
                } catch (e) {
                    grid.innerHTML = '<div class="col-span-2 text-center py-10 text-red-500">Failed to load gifts.</div>';
                }
            },

            async fetchHistory() {
                const list = document.getElementById('history-list');
                list.innerHTML = '<div class="text-center py-10 opacity-50">Fetching History...</div>';

                try {
                    const res = await fetch(`${API_BASE}/history`);
                    const data = await res.json();
                    list.innerHTML = '';

                    // Flatten API structure
                    let flatData = [];
                    data.forEach(day => {
                        day.child.forEach(entry => {
                            flatData.push({ date: day.date, ...entry });
                        });
                    });

                    flatData.slice(0, 20).forEach((item, idx) => {
                        const row = document.createElement('div');
                        row.className = `bg-white p-4 rounded-xl border border-slate-100 flex items-center justify-between shadow-sm ${idx === 0 ? 'ring-2 ring-accent ring-offset-2' : ''}`;
                        row.innerHTML = `
                            <div class="flex flex-col">
                                <span class="text-[10px] font-bold text-slate-400 uppercase">${item.date}</span>
                                <span class="text-xs font-bold text-navy">${item.time}</span>
                            </div>
                            <div class="flex gap-4 items-center">
                                <div class="text-right hidden sm:block">
                                    <p class="text-[9px] text-slate-400 font-mono">SET: ${item.set}</p>
                                    <p class="text-[9px] text-slate-400 font-mono">VAL: ${item.value}</p>
                                </div>
                                <div class="bg-navy text-white h-10 w-10 flex items-center justify-center rounded-lg font-bold text-lg">
                                    ${item.twod}
                                </div>
                            </div>
                        `;
                        list.appendChild(row);
                    });
                } catch (e) {
                    list.innerHTML = '<div class="text-center py-10 text-red-500">Failed to load history.</div>';
                }
            }
        };

        window.onload = () => app.init();
    </script>
</body>
</html>
