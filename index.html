<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SET 2D Live - Professional Market Monitor</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0c10;
            --card-bg: #161b22;
            --border: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-green: #3fb950;
            --accent-red: #f85149;
            --accent-yellow: #d29922;
            --accent-blue: #58a6ff;
            --live-pulse: rgba(63, 185, 80, 0.4);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* Sticky Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(13, 17, 23, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            display: flex;
            align-items: center;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
            gap: 6px;
        }

        .status-live { background: rgba(63, 185, 80, 0.1); color: var(--accent-green); }
        .status-locked { background: rgba(210, 153, 34, 0.1); color: var(--accent-yellow); }
        .status-closed { background: rgba(139, 148, 158, 0.1); color: var(--text-secondary); }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: currentColor;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 var(--live-pulse); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(0,0,0,0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0,0,0,0); }
        }

        /* Hero Card */
        .hero-container {
            padding: 20px 16px;
        }

        .hero-card {
            background: linear-gradient(145deg, #1c2128, #161b22);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }

        .main-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 84px;
            font-weight: 700;
            margin: 10px 0;
            color: var(--text-primary);
            text-shadow: 0 0 20px rgba(88, 166, 255, 0.2);
        }

        .market-data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 20px;
        }

        .data-point {
            background: rgba(48, 54, 61, 0.3);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .label { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .value { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 600; display: block; margin-top: 4px; }

        /* Session Cards */
        .sessions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 16px 20px;
        }

        .session-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            position: relative;
        }

        .session-time { font-weight: 700; font-size: 14px; margin-bottom: 8px; display: block; }
        .session-result { font-family: 'JetBrains Mono', monospace; font-size: 24px; color: var(--accent-blue); }

        /* History Table */
        .history-section {
            padding: 0 16px 40px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            font-size: 13px;
        }

        .history-table th {
            background: #21262d;
            text-align: left;
            padding: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 10px;
        }

        .history-table td {
            padding: 12px;
            border-top: 1px solid var(--border);
        }

        /* Verification Badge */
        .v-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
        }
        .v-verified { color: var(--accent-green); border: 1px solid var(--accent-green); }
        .v-warning { color: var(--accent-yellow); border: 1px solid var(--accent-yellow); }

        /* Skeleton Loading */
        .skeleton {
            background: linear-gradient(90deg, #161b22 25%, #21262d 50%, #161b22 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Mobile Optimization */
        @media (max-width: 360px) {
            .main-number { font-size: 64px; }
            .sessions-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; flex-direction: column;">
            <span style="font-weight: 700; letter-spacing: -0.5px;">SET 2D LIVE</span>
            <span id="clock" style="font-size: 11px; color: var(--text-secondary); font-family: 'JetBrains Mono';">--:--:--</span>
        </div>
        <div id="market-status" class="status-badge status-closed">
            <div class="pulse-dot"></div>
            <span>Detecting...</span>
        </div>
    </header>

    <main>
        <div class="hero-container">
            <div class="hero-card">
                <span class="label">တိုက်ရိုက်တင်ဆက်ခြင်း</span>
                <div id="live-2d" class="main-number">--</div>
                
                <div class="market-data-grid">
                    <div class="data-point">
                        <span class="label">SET Index</span>
                        <span id="live-set" class="value">----.--</span>
                    </div>
                    <div class="data-point">
                        <span class="label">Value</span>
                        <span id="live-val" class="value">---.--M</span>
                    </div>
                </div>
                
                <div id="verification-status" style="margin-top: 15px;">
                    <!-- Verification Badge Injected Here -->
                </div>
            </div>
        </div>

        <div class="sessions-grid">
            <div class="session-card" data-session="11:00">
                <span class="session-time">11:00 AM</span>
                <span class="session-result">49</span>
            </div>
            <div class="session-card" data-session="12:01">
                <span class="session-time">12:01 PM</span>
                <span class="session-result">50</span>
            </div>
            <div class="session-card" data-session="15:00">
                <span class="session-time">03:00 PM</span>
                <span class="session-result">95</span>
            </div>
            <div class="session-card" data-session="16:30">
                <span class="session-time">04:30 PM</span>
                <span class="session-result">--</span>
            </div>
        </div>

        <section class="history-section">
            <div class="section-title">
                <span>Recent History</span>
                <span id="data-source" style="font-size: 10px; color: var(--text-secondary);">Source: Live Market</span>
            </div>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>SET</th>
                        <th>Value</th>
                        <th>2D</th>
                    </tr>
                </thead>
                <tbody id="history-body">
                    <!-- History rows injected here -->
                </tbody>
            </table>
        </section>
    </main>

    <script>
        /**
         * SET-Linked 2D Engine
         * Clean Architecture: fetchLayer | calculationEngine | storageLayer | renderLayer
         */

        const CONFIG = {
            API_LIVE: 'https://api.thaistock2d.com/live',
            API_RESULTS: 'https://api.thaistock2d.com/2d_result',
            POLL_INTERVAL: 5000,
            SHEET_DB: '', // User to provide SheetDB endpoint for long-term persistence
            DRAW_TIMES: ['11:00', '12:01', '15:00', '16:30'],
            MYANMAR_OFFSET: 6.5 * 60 * 60 * 1000
        };

        const STATE = {
            market: 'CLOSED', // LIVE, LOCKED, CLOSED
            lastUpdate: null,
            abortController: null,
            cache: JSON.parse(localStorage.getItem('twod_cache') || '{}')
        };

        // --- Calculation Engine ---
        const CalculationEngine = {
            /**
             * 2D Calculation Logic:
             * Last digit of SET Index + Last digit of Value
             */
            derive2D: (set, value) => {
                if (!set || !value) return null;
                const setStr = parseFloat(set).toFixed(2).toString();
                const valStr = parseFloat(value).toFixed(2).toString();
                
                const lastSet = setStr.split('.')[1].slice(-1); // Last digit of decimal
                const lastVal = valStr.split('.')[0].slice(-1); // Last digit of integer part before decimal for some systems, or specific logic
                
                // Thai Official 2D: Last digit of Index + Last digit of Value
                // Example: Index 1450.56, Value 45678.90 -> 2D is 60
                const d1 = setStr.charAt(setStr.length - 1);
                const d2 = valStr.split('.')[0].charAt(valStr.split('.')[0].length - 1);
                
                return d1 + d2;
            },

            verify: (calculated, reported) => {
                return calculated === reported;
            }
        };

        // --- Fetch Layer ---
        const FetchLayer = {
            async getLive() {
                if (STATE.abortController) STATE.abortController.abort();
                STATE.abortController = new AbortController();

                try {
                    const response = await fetch(CONFIG.API_LIVE, { signal: STATE.abortController.signal });
                    return await response.json();
                } catch (e) {
                    if (e.name === 'AbortError') return null;
                    throw e;
                }
            },

            async getResults() {
                try {
                    const response = await fetch(CONFIG.API_RESULTS);
                    return await response.json();
                } catch (e) {
                    console.error("Historical fetch failed", e);
                    return null;
                }
            }
        };

        // --- Storage Layer ---
        const StorageLayer = {
            save(data) {
                localStorage.setItem('twod_cache', JSON.stringify(data));
                
                // Persistence logic: Only save to remote if market state is FINAL
                if (STATE.market === 'LOCKED' && CONFIG.SHEET_DB) {
                    this.pushToRemote(data);
                }
            },

            async pushToRemote(data) {
                // Implementation for SheetDB / remote audit log
                try {
                    await fetch(CONFIG.SHEET_DB, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            timestamp: new Date().toISOString(),
                            set: data.live.set,
                            val: data.live.value,
                            twod: data.live.twod,
                            verified: data.verified
                        })
                    });
                } catch (e) { /* Fail silently to not interrupt UI */ }
            }
        };

        // --- Render Layer ---
        const UI = {
            updateClock() {
                const now = new Date();
                const mmTime = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + CONFIG.MYANMAR_OFFSET);
                document.getElementById('clock').textContent = mmTime.toLocaleTimeString('en-GB', { hour12: false });
                return mmTime;
            },

            updateMarketStatus(state) {
                const el = document.getElementById('market-status');
                el.className = `status-badge status-${state.toLowerCase()}`;
                el.querySelector('span').textContent = state;
                STATE.market = state;
            },

            renderLive(data) {
                const twodEl = document.getElementById('live-2d');
                const setEl = document.getElementById('live-set');
                const valEl = document.getElementById('live-val');
                const vEl = document.getElementById('verification-status');

                // Animate change if value is different
                if (twodEl.textContent !== data.twod) {
                    twodEl.style.transform = 'scale(1.1)';
                    setTimeout(() => twodEl.style.transform = 'scale(1)', 200);
                }

                twodEl.textContent = data.twod || '--';
                setEl.textContent = data.set || '----.--';
                valEl.textContent = data.value ? `${data.value}` : '---.--M';

                // Verification
                const calculated = CalculationEngine.derive2D(data.set, data.value);
                const isVerified = calculated === data.twod;
                
                vEl.innerHTML = isVerified 
                    ? `<span class="v-badge v-verified">✔ အတည်ပြုလိုက်ပါပြီ </span>`
                    : `<span class="v-badge v-warning">⚠ မငြိမ်သေးပါ </span>`;
            },

            renderSessions(results) {
                if (!results) return;
                const sessions = ['11:00', '12:01', '15:00', '16:30'];
                sessions.forEach(time => {
                    const match = results.find(r => r.time === time);
                    const card = document.querySelector(`.session-card[data-session="${time}"] .session-result`);
                    if (match && card) card.textContent = match.twod;
                });
            },

            renderHistory(history) {
                const body = document.getElementById('history-body');
                if (!history || history.length === 0) return;
                
                body.innerHTML = history.slice(0, 10).map(row => `
                    <tr>
                        <td>${row.time}</td>
                        <td class="font-mono">${row.set}</td>
                        <td class="font-mono">${row.value}</td>
                        <td style="font-weight:700; color:var(--accent-blue)">${row.twod}</td>
                    </tr>
                `).join('');
            }
        };

        // --- Core Application Logic ---
        async function updateCycle() {
            const now = UI.updateClock();
            const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');

            // 1. Determine Market State
            let currentStatus = 'CLOSED';
            const day = now.getDay(); // 0 Sun, 6 Sat
            const hour = now.getHours();

            if (day >= 1 && day <= 5) { // Mon-Fri
                if ((hour >= 9 && hour < 11) || (hour >= 13 && hour < 15)) {
                    currentStatus = 'LIVE';
                } else if (CONFIG.DRAW_TIMES.includes(timeStr)) {
                    currentStatus = 'LOCKED';
                } else if (hour >= 11 && hour <= 16) {
                    currentStatus = 'OPEN'; // Market open but between draws
                }
            }
            UI.updateMarketStatus(currentStatus);

            // 2. Fetch Data
            try {
                const liveData = await FetchLayer.getLive();
                if (liveData && liveData.live) {
                    UI.renderLive(liveData.live);
                    UI.renderSessions(liveData.result);
                    UI.renderHistory(liveData.result);
                    
                    // 3. Storage
                    StorageLayer.save(liveData);
                }
            } catch (err) {
                console.error("Update cycle interrupted", err);
            }

            // Exponential backoff or constant polling based on state
            setTimeout(updateCycle, CONFIG.POLL_INTERVAL);
        }

        // Initialize
        window.addEventListener('load', () => {
            // Load from cache first for instant UX
            if (STATE.cache.live) {
                UI.renderLive(STATE.cache.live);
                UI.renderSessions(STATE.cache.result);
                UI.renderHistory(STATE.cache.result);
            }
            updateCycle();
            
            // Start clock interval for seconds
            setInterval(UI.updateClock, 1000);
        });

    </script>
</body>
</html>
