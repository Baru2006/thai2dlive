<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thai Stock 2D | Premium Live Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-wrapper">
        <header class="header">
            <div class="header-top">
                <h1 class="logo">THAI <span>2D</span></h1>
                <div class="status-indicator" id="status">CONNECTING</div>
            </div>
            <div id="mst-container" class="mst-display">
                <div id="mst-time" class="mst-time">--:--:--</div>
                <div id="mst-date" class="mst-date">--------</div>
            </div>
        </header>

        <main class="container">
            <!-- Hero Section: Live Result -->
            <section class="live-card">
                <div class="card-header">
                    <span class="live-label">LIVE RESULT</span>
                </div>
                <div class="live-2d">
                    <span class="digit" id="digit1">-</span>
                    <span class="digit" id="digit2">-</span>
                </div>
                <div class="market-stats">
                    <div class="stat-item">
                        <span class="stat-label">SET</span>
                        <span class="stat-value" id="set">--</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                        <span class="stat-label">VALUE</span>
                        <span class="stat-value" id="value">--</span>
                    </div>
                </div>
            </section>

            <!-- Daily Sessions -->
            <section class="sessions-container">
                <h2 class="section-title">Today's Results</h2>
                <div class="sessions-grid">
                    <div class="session-card">
                        <span class="time">11:00 AM</span>
                        <span id="session1" class="number">--</span>
                    </div>
                    <div class="session-card">
                        <span class="time">12:01 PM</span>
                        <span id="session2" class="number">--</span>
                    </div>
                    <div class="session-card">
                        <span class="time">03:00 PM</span>
                        <span id="session3" class="number">--</span>
                    </div>
                    <div class="session-card">
                        <span class="time">04:30 PM</span>
                        <span id="session4" class="number">--</span>
                    </div>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Live</span>
            </a>
            <a href="gift.html" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect width="20" height="5" x="2" y="7"/><line x1="12" x2="12" y1="22" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
                <span>Gifts</span>
            </a>
            <a href="https://t.me/thaistock_2d?direct" class="nav-item" target="_blank">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>
                <span>Chat</span>
            </a>
        </nav>
    </div>

    <script src="data.js"></script>
    <script src="state.js"></script>
    <script src="ui.js"></script>
    <script>
        ui.init();
    </script>
    <div id="sticky-anchor-ad">
        <button class="close-btn" onclick="document.getElementById('sticky-anchor-ad').style.display='none';">×</button>
        <div class="ad-wrapper">
            <a href="https://t.me/thaistock_2d?direct" target="_blank" rel="noopener noreferrer">
                <img src="https://i.postimg.cc/pdcbbw78/In-Shot-20260131-215455741.gif" alt="Join Telegram">
            </a>
        </div>
    </div>
</body>
</html>
