<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thai Stock 2D | Live Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Inter Font for professional data display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-wrapper">
        <header class="header">
            <h1 class="logo">Thai Stock <span>2D</span></h1>
            <div class="status-indicator" id="status">CONNECTING</div>
        </header>

        <main class="container">
            <!-- Hero Section: Live Result -->
            <section class="live-card">
                <div class="live-label">LIVE RESULT</div>
                <div class="live-2d">
                    <span class="digit" id="digit1">--</span>
                    <span class="digit-separator"></span>
                    <span class="digit" id="digit2">--</span>
                </div>
                
                <div class="market-data">
                    <div class="data-item">
                        <span class="label">SET Index</span>
                        <span class="value" id="set">--</span>
                    </div>
                    <div class="data-divider"></div>
                    <div class="data-item">
                        <span class="label">Value</span>
                        <span class="value" id="value">--</span>
                    </div>
                </div>
            </section>
            <section>
                <style>
        /* Base Styles */
        body {
            color: #ffffff; /* Thai stock white */
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Container & Table Styling */
        .table-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 116, 217, 0.3); /* Subtle light blue border */
        }

        h2 {
            text-align: center;
            color: #0074D9; /* 2D light blue */
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px; /* Space between rows */
        }

        th {
            text-align: left;
            padding: 12px 15px;
            color: #0074D9;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #0074D9;
        }

        td {
            padding: 15px;
            background-color: rgba(255, 255, 255, 0.03);
            font-weight: 600;
            transition: all 0.3s ease;
        }

        /* Row styling */
        tr td:first-child {
            border-radius: 8px 0 0 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        tr td:last-child {
            border-radius: 0 8px 8px 0;
        }

        /* Number/Data Styling */
        .stock-number {
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 1.2rem;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 116, 217, 0.5);
        }

        /* Hover & Interaction */
        tbody tr:hover td {
            background-color: rgba(0, 116, 217, 0.2);
            transform: scale(1.01);
            cursor: default;
        }

        /* Status Indicator */
        .status-dot {
            height: 8px;
            width: 8px;
            background-color: #0074D9;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            box-shadow: 0 0 8px #0074D9;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.7; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.7; }
        }
            </style>
                    <div class="table-container">
    <h2><span class="status-dot"></span>Market Insights</h2>
    <table id="modernInternetTable">
        <thead>
            <tr>
                <th>Time</th>
                <th>Modern</th>
                <th>Internet</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>9:30 AM</td>
                <td id="mod930" class="stock-number">--</td>
                <td id="int930" class="stock-number">--</td>
            </tr>
            <tr>
                <td>2:00 PM</td>
                <td id="mod1400" class="stock-number">--</td>
                <td id="int1400" class="stock-number">--</td>
            </tr>
        </tbody>
    </table>
                    </div>
                <script>
    const apimoinURL = "https://sheetdb.io/api/v1/n0wlxdgwqueub";

    async function updateTable() {
        try {
            const res = await fetch(apimoinURL);
            const data = await res.json();

            // Apply value with a subtle transition effect
            updateValue("mod930", data[0]?.Modern);
            updateValue("int930", data[0]?.Internet);
            updateValue("mod1400", data[1]?.Modern);
            updateValue("int1400", data[1]?.Internet);

        } catch (err) {
            console.error("API fetch error:", err);
        }
    }

    function updateValue(id, value) {
        const element = document.getElementById(id);
        const newValue = value || "--";
        
        // Only update if value changed to keep it clean
        if (element.textContent !== newValue) {
            element.style.opacity = "0";
            setTimeout(() => {
                element.textContent = newValue;
                element.style.opacity = "1";
            }, 200);
        }
    }

    // Initial load + refresh every 5 sec
    updateTable();
    setInterval(updateTable, 5000);
        </script>
            </section>
            <!-- Session Timeline -->
            <section class="timeline-container">
                <h2 class="section-title">Today's Results</h2>
                <div class="session-grid">
                    <div class="session-card">
                        <div class="time">11:00 AM</div>
                        <div class="number" id="session1">--</div>
                    </div>
                    <div class="session-card">
                        <div class="time">12:01 PM</div>
                        <div class="number" id="session2">--</div>
                    </div>
                    <div class="session-card">
                        <div class="time">03:00 PM</div>
                        <div class="number" id="session3">--</div>
                    </div>
                    <div class="session-card">
                        <div class="time">04:30 PM</div>
                        <div class="number" id="session4">--</div>
                    </div>
                </div>
            </section>
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item active">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Home</span>
            </a>
            <a href="https://t.me/thaistock_2d" class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span>Updates Channel</span>
            </a>
        </nav>
    </div>

    <script src="data.js"></script>
    <script src="state.js"></script>
    <script src="ui.js"></script>
    <script>
        ui.init();
    </script>
</body>
</html>
