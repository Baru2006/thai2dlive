<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GIFT 2D - THAI 2D LIVE</title>
    <style>
        :root {
            --navy: #001f3f;
            --deep-blue: #003366;
            --white: #ffffff;
            --gray: #f4f4f4;
            --gold: #d4af37;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--gray); padding-bottom: 80px; }
        
        header {
            background-color: var(--navy);
            color: var(--white);
            padding: 15px;
            text-align: center;
            border-bottom: 4px solid var(--deep-blue);
        }

        .gift-container {
            padding: 20px;
        }

        .date-badge {
            text-align: center;
            font-size: 14px;
            color: var(--navy);
            font-weight: bold;
            margin-bottom: 20px;
        }

        .number-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .gift-card {
            background: var(--white);
            aspect-ratio: 1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 900;
            color: var(--navy);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 3px solid var(--navy);
            position: relative;
        }

        .gift-card::after {
            content: 'GIFT';
            position: absolute;
            bottom: -5px;
            background: var(--navy);
            color: white;
            font-size: 8px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .horizontal-cards {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .caption-bar {
            background: var(--white);
            padding: 15px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border: 1px solid #ddd;
        }

        .caption-text { font-weight: bold; color: var(--navy); letter-spacing: 1px; }
        .caption-circles { display: flex; gap: 10px; }
        .mini-circle {
            width: 35px;
            height: 35px;
            background: var(--navy);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
        }

        nav.footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: var(--white);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            border-top: 1px solid #ddd;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #666;
            font-size: 11px;
            font-weight: bold;
        }
        .nav-item.active { color: var(--navy); background: #f0f7ff; }
        .nav-item svg { width: 24px; height: 24px; margin-bottom: 4px; }
    </style>
</head>
<body>

<header>
    <div style="font-size: 20px; font-weight: bold; letter-spacing: 1px;">THAI 2D LIVE</div>
</header>

<div class="gift-container">
    <div class="date-badge" id="giftDate">DATE : --.--.26</div>

    <div class="number-grid">
        <div class="gift-card">08</div>
        <div class="gift-card">12</div>
        <div class="gift-card">24</div>
        <div class="gift-card">45</div>
        <div class="gift-card">67</div>
        <div class="gift-card">89</div>
    </div>

    <div style="text-align: center; margin: 20px 0; font-weight: bold; color: #888; font-size: 12px;">CAPTION</div>

    <div class="horizontal-cards">
        <div class="caption-bar">
            <span class="caption-text">CAPTION</span>
            <div class="caption-circles">
                <div class="mini-circle">19</div>
                <div class="mini-circle">91</div>
            </div>
        </div>
        <div class="caption-bar">
            <span class="caption-text">CAPTION</span>
            <div class="caption-circles">
                <div class="mini-circle">30</div>
                <div class="mini-circle">03</div>
            </div>
        </div>
    </div>
</div>

<nav class="footer">
    <a href="gift.html" class="nav-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="14" rx="2"/><path d="M12 5V22M7 12H17M12 5H7M12 5H17"/></svg>
        GIFT 2D
    </a>
    <a href="home.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        HOME
    </a>
    <a href="update.html" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        UPDATE
    </a>
</nav>

<script>
    const now = new Date();
    document.getElementById('giftDate').innerText = `DATE : ${now.getDate().toString().padStart(2,'0')}.${(now.getMonth()+1).toString().padStart(2,'0')}.${now.getFullYear().toString().slice(-2)}`;
</script>
</body>
</html>
